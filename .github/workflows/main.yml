name: Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential flex git \
            libssl-dev libncurses-dev \
            zstd clang lld llvm \
            python3 ccache \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi gcc-arm-linux-gnueabihf

      - name: Fix broken kernel config (important)
        run: |
          echo "Fixing stack protector for older clang builds..."
          sed -i 's/CONFIG_CC_STACKPROTECTOR_STRONG=y/CONFIG_CC_STACKPROTECTOR=y/' config.G970F || true

      - name: build
        env:
          token: ${{ secrets.TOKEN }}
          CC: clang
          LLVM: 1
          LLVM_IAS: 1
        run: |
          chmod +x build.sh
          ./build.sh "${token}"
